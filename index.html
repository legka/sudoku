<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Sudoku and Killer Sudoku for web and mobile web." />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23345'/%3E%3Cpath d='M5.5 0v16M10.5 0v16M0 5.5h16M0 10.5h16' stroke='%23fff' stroke-width='.8'/%3E%3C/svg%3E" />
    <title>Sudoku</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>Sudoku</h1>
        <div class="stats">
          <span class="stat"><span class="label">Time</span> <span id="timer">0:00</span></span>
          <span class="stat"><span class="label">Mistakes</span> <span id="mistakes">0</span></span>
          <button id="theme-toggle" class="theme-btn" type="button" aria-label="Toggle color theme" title="Toggle theme">🌓</button>
        </div>
      </header>

      <section class="settings" aria-label="Game settings">
        <label>
          Mode
          <select id="mode">
            <option value="classic">Classic</option>
            <option value="killer">Killer</option>
          </select>
        </label>
        <label>
          Difficulty
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>
          </select>
        </label>
        <button id="new-game" class="btn" type="button">New game</button>
        <label class="checkbox-label">
          <input type="checkbox" id="auto-check" checked />
          Auto-check
        </label>
      </section>

      <main class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
        <div id="loading" class="loading" role="status" hidden></div>
      </main>

      <nav class="actions" aria-label="Actions">
        <button id="undo" class="btn" type="button" aria-keyshortcuts="Control+z" title="Undo (Ctrl+Z)" disabled>
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
          </svg>
          <span class="action-title">Undo</span>
        </button>
        <button id="erase" class="btn" type="button" aria-keyshortcuts="Delete Backspace" title="Erase (Del)">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" />
            <path d="M22 21H7" />
            <path d="m5 11 9 9" />
          </svg>
          <span class="action-title">Erase</span>
        </button>
        <button id="notes" class="btn" type="button" aria-keyshortcuts="n" aria-pressed="false" title="Notes (N)">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
            <path d="m15 5 4 4" />
          </svg>
          <span class="action-title">Notes</span>
        </button>
        <button id="hint" class="btn" type="button" aria-keyshortcuts="h" title="Hint (H)">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
            <path d="M9 18h6" />
            <path d="M10 22h4" />
          </svg>
          <span class="action-title">Hint</span>
        </button>
      </nav>

      <div id="pad" class="pad" aria-label="Number pad"></div>
    </div>

    <dialog id="win" class="win">
      <h2>Solved!</h2>
      <p id="win-text"></p>
      <div class="win-actions">
        <button id="win-close" class="btn" type="button">Close</button>
        <button id="win-new" class="btn primary" type="button">New game</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
